on:
  push:
    branches: ["main"]
    paths-ignore:
      - "latest_build_firmware/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and required libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library" "Adafruit BusIO" "Adafruit SH110X"

      - name: Compile Arduino sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "esp32:esp32:esp32s3"
          sketch-paths: "./HF_NoiseReduction_ESP32S3_OLED"
          enable-deltas-report: true
          libraries: |
            - name: Adafruit GFX Library
            - name: Adafruit BusIO
            - name: Adafruit SH110X

      - name: Build firmware binaries
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --output-dir ./firmware-build \
            --export-binaries \
            ./HF_NoiseReduction_ESP32S3_OLED

      - name: Store latest firmware binary in the repository
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p latest_build_firmware
          rm -f latest_build_firmware/*.bin
          cp firmware-build/*.bin latest_build_firmware/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A latest_build_firmware
          if ! git diff --cached --quiet; then
            git commit -m "Update latest firmware build"
            git push origin HEAD:refs/heads/main
          fi

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-firmware
          path: firmware-build/*.bin
          if-no-files-found: error
          retention-days: 30
